name: Repair repository layout

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-layout-main
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'AngeIine/JAS_2v2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the current main branch
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true

      - name: Restore directories and verify all preserved files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import shutil
          
          
          def repair(root):
              root = Path(root).resolve()
              inner = root / 'JAS_2v2'
              if not inner.is_dir():
                  raise RuntimeError('The old JAS_2v2 directory is missing. No files were changed.')
              if not (root / 'README.md').is_file():
                  raise RuntimeError('The new root README.md is missing. No files were changed.')
          
              def check_path(path):
                  if path.is_symlink() or not path.resolve().is_relative_to(root):
                      raise RuntimeError('Unexpected path: ' + str(path))
          
              def digest(path):
                  return hashlib.sha256(path.read_bytes()).hexdigest()
          
              original_files = sorted(p for p in inner.rglob('*') if p.is_file())
              obsolete_readmes = {'README.md', 'code/README.md'}
              copies = []
              duplicates = {}
              preserved = {}
              for source in original_files:
                  check_path(source)
                  rel = source.relative_to(inner)
                  if rel.as_posix() in obsolete_readmes:
                      continue
                  destination = root / rel
                  check_path(destination)
                  if destination.exists() and (not destination.is_file() or digest(destination) != digest(source)):
                      raise RuntimeError('Different versions exist at: ' + rel.as_posix())
                  copies.append((source, destination))
                  preserved[rel.as_posix()] = digest(source)
                  # Browser upload placed these files at the root by their basename.
                  flat = root / source.name
                  if len(rel.parts) > 1 and flat.is_file():
                      if digest(flat) != digest(source):
                          raise RuntimeError('A root file differs from the original: ' + flat.name)
                      if flat in duplicates and duplicates[flat] != destination:
                          raise RuntimeError('Ambiguous duplicate basename: ' + flat.name)
                      duplicates[flat] = destination
          
              figures = ['action_to_score.png', 'dataset_overview.png', 'framework.png', 'feature_analysis.png']
              figure_moves = []
              for name in figures:
                  source = root / name
                  destination = root / 'assets/figures' / name
                  check_path(source)
                  check_path(destination)
                  if source.is_file():
                      if destination.exists() and digest(source) != digest(destination):
                          raise RuntimeError('Different image versions exist: ' + name)
                      figure_moves.append((source, destination))
                  elif not destination.is_file():
                      raise RuntimeError('Upload the missing image to the root first: ' + name)
          
              # Validate every collision and missing image before changing any file.
              for source, destination in copies:
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  if not destination.exists():
                      shutil.copyfile(source, destination)
              for source, destination in figure_moves:
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  if not destination.exists():
                      shutil.copyfile(source, destination)
                  if digest(source) != digest(destination):
                      raise RuntimeError('Image verification failed: ' + source.name)
              for rel, expected in preserved.items():
                  if digest(root / rel) != expected:
                      raise RuntimeError('Preservation check failed: ' + rel)
          
              for duplicate, destination in duplicates.items():
                  if digest(duplicate) != digest(destination):
                      raise RuntimeError('Duplicate check failed: ' + duplicate.name)
                  duplicate.unlink()
              for source, destination in figure_moves:
                  source.unlink()
              code_readme = root / 'code/README.md'
              if code_readme.exists():
                  original_readme = inner / 'code/README.md'
                  if not original_readme.is_file() or digest(code_readme) != digest(original_readme):
                      raise RuntimeError('An unexpected code README exists; inspect it first.')
                  code_readme.unlink()
          
              # All retained originals have already been verified at their new paths.
              for path in sorted(inner.rglob('*'), key=lambda p: len(p.parts), reverse=True):
                  check_path(path)
                  if path.is_file():
                      path.unlink()
                  else:
                      path.rmdir()
              inner.rmdir()
          
              for rel, expected in preserved.items():
                  assert digest(root / rel) == expected, rel
              assert not list(root.glob('*.csv')), 'Unexpected CSVs remain at root.'
              assert not list(root.glob('*.py')), 'Unexpected scripts remain at root.'
              assert all((root / 'assets/figures' / name).is_file() for name in figures)
              readmes = [p for p in root.rglob('README.md') if '.git' not in p.relative_to(root).parts]
              assert readmes == [root / 'README.md'], readmes
              text = (root / 'README.md').read_text(encoding='utf-8')
              for target in re.findall(r'<img[^>]+src="([^"]+)"', text):
                  if not target.startswith(('https://', 'http://')):
                      assert (root / target).is_file(), target
              print('Verified original files:', len(preserved))
              print('Removed identical root duplicates:', len(duplicates))
              print('Verified paper images:', len(figures))
              print('Layout repair completed; the root README was preserved.')
              return preserved
          
          
          if __name__ == '__main__':
              repair(Path.cwd())
          PY

      - name: Commit the verified layout
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No layout changes to commit."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Repair repository layout and README image paths"
            git push origin HEAD:main
          fi
